<!--
  Tuner concept 3 - "Chrome tuning fork".
  Candy-red glossy body, mirror-chrome fork, one obligatory y2k sparkle. The most legible of the
  five at 60px because it is one silhouette.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="t3-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a86"/>
      <stop offset=".5" stop-color="#e11b2c"/>
      <stop offset=".52" stop-color="#bd0d22"/>
      <stop offset="1" stop-color="#6d0014"/>
    </linearGradient>
    <linearGradient id="t3-chrome" x1="0" y1="90" x2="0" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#c9d7e6"/>
      <stop offset=".5" stop-color="#7c8ea4"/>
      <stop offset=".52" stop-color="#e8f0f8"/>
      <stop offset=".8" stop-color="#96a7bb"/>
      <stop offset="1" stop-color="#5a6b80"/>
    </linearGradient>
    <linearGradient id="t3-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="t3-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#t3-body)"/>

  <!-- Ringing arcs. -->
  <g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="12" stroke-linecap="round">
    <path d="M118 150c-30 40-30 96 0 136"/>
    <path d="M394 150c30 40 30 96 0 136"/>
  </g>

  <!-- Fork: two tines, a U yoke, stem and ball. -->
  <g fill="#3a0009" opacity=".3">
    <rect x="174" y="102" width="46" height="212" rx="23"/>
    <rect x="304" y="102" width="46" height="212" rx="23"/>
    <rect x="174" y="244" width="176" height="88" rx="44"/>
    <rect x="240" y="312" width="44" height="70" rx="12"/>
    <circle cx="262" cy="392" r="28"/>
  </g>
  <g fill="url(#t3-chrome)">
    <rect x="168" y="96" width="46" height="212" rx="23"/>
    <rect x="298" y="96" width="46" height="212" rx="23"/>
    <rect x="168" y="238" width="176" height="88" rx="44"/>
    <rect x="234" y="306" width="44" height="70" rx="12"/>
    <circle cx="256" cy="386" r="28"/>
  </g>
  <!-- Specular strip down the left of every limb. -->
  <g fill="#fff" opacity=".7">
    <rect x="178" y="112" width="12" height="150" rx="6"/>
    <rect x="308" y="112" width="12" height="150" rx="6"/>
    <rect x="242" y="316" width="10" height="46" rx="5"/>
    <circle cx="245" cy="376" r="8"/>
  </g>
  <g fill="none" stroke="#33414f" stroke-opacity=".5" stroke-width="4">
    <rect x="168" y="96" width="46" height="212" rx="23"/>
    <rect x="298" y="96" width="46" height="212" rx="23"/>
  </g>

  <!-- Sparkle. -->
  <path d="M378 96 391 133 428 146 391 159 378 196 365 159 328 146 365 133Z" fill="#fff" opacity=".92"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#t3-gloss)"/>
  <rect width="512" height="512" fill="url(#t3-vig)"/>
</svg>
