<!--
  Tuner concept 1 - "VU meter".
  Brushed-chrome body with a hard y2k midline, cream analog meter face, red needle parked on the
  green in-tune tick. Full bleed: iOS masks the corners itself.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="t1-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2f6fb"/>
      <stop offset=".28" stop-color="#b6c5d8"/>
      <stop offset=".5" stop-color="#7e90a8"/>
      <stop offset=".52" stop-color="#5d7089"/>
      <stop offset="1" stop-color="#26344a"/>
    </linearGradient>
    <linearGradient id="t1-face" x1="0" y1="128" x2="0" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf1"/>
      <stop offset=".55" stop-color="#f6ecc9"/>
      <stop offset="1" stop-color="#dcc590"/>
    </linearGradient>
    <radialGradient id="t1-hub" cx="246" cy="348" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#b9c6d6"/>
      <stop offset="1" stop-color="#5b6b80"/>
    </radialGradient>
    <linearGradient id="t1-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="t1-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#t1-body)"/>

  <!-- Meter face, dropped into the metal. -->
  <rect x="82" y="130" width="348" height="252" rx="30" fill="url(#t1-face)"/>
  <path d="M82 160v-1a30 30 0 0 1 30-29h288a30 30 0 0 1 30 29v1c0-8-14-14-32-14H114c-18 0-32 6-32 14Z" fill="#8a7a52" opacity=".55"/>
  <rect x="82" y="130" width="348" height="252" rx="30" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="8"/>

  <!-- Scale ticks. Red at the extremes, green dead centre. -->
  <g stroke-linecap="round">
    <g stroke="#b8402f" stroke-width="14">
      <line x1="141" y1="262" x2="117" y2="241"/>
      <line x1="371" y1="262" x2="395" y2="241"/>
    </g>
    <g stroke="#8a7343" stroke-width="12">
      <line x1="170" y1="235" x2="152" y2="209"/>
      <line x1="342" y1="235" x2="360" y2="209"/>
      <line x1="205" y1="217" x2="194" y2="187"/>
      <line x1="307" y1="217" x2="318" y2="187"/>
    </g>
    <line x1="256" y1="212" x2="256" y2="172" stroke="#1c9b2e" stroke-width="20"/>
  </g>

  <!-- Needle. -->
  <polygon points="259,192 271,352 250,352" fill="#000" opacity=".18"/>
  <polygon points="256,186 267,350 245,350" fill="#d4262a"/>
  <polygon points="256,186 261,350 253,350" fill="#ff8a7a" opacity=".7"/>
  <circle cx="256" cy="352" r="32" fill="url(#t1-hub)"/>
  <circle cx="256" cy="352" r="32" fill="none" stroke="#2c3a4c" stroke-width="5"/>

  <!-- Glass over the dial, then the icon's own convex gloss. -->
  <path d="M92 160c60-24 268-24 328 0v52c-90 34-238 34-328 0Z" fill="#fff" opacity=".38"/>
  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#t1-gloss)"/>
  <rect width="512" height="512" fill="url(#t1-vig)"/>
</svg>
