<!--
  Songs concept 2 - "Chrome note".
  Candy-blue gloss body, a beamed eighth note in mirror chrome with a hard midline, drop shadow
  and a sparkle. Reads at any size; says "music" rather than "chords".
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="s2-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fe6ff"/>
      <stop offset=".5" stop-color="#1a86e8"/>
      <stop offset=".52" stop-color="#0c66c8"/>
      <stop offset="1" stop-color="#062a70"/>
    </linearGradient>
    <linearGradient id="s2-chrome" x1="0" y1="100" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#cfdcea"/>
      <stop offset=".5" stop-color="#798ca3"/>
      <stop offset=".52" stop-color="#f0f6fc"/>
      <stop offset=".78" stop-color="#9aabbf"/>
      <stop offset="1" stop-color="#53637a"/>
    </linearGradient>
    <linearGradient id="s2-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="s2-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#s2-body)"/>

  <!-- Shadow copy. -->
  <g fill="#04234f" opacity=".35">
    <path d="M172 116 428 68v66L172 182Z"/>
    <rect x="172" y="116" width="32" height="200"/>
    <rect x="396" y="68" width="32" height="200"/>
    <ellipse cx="140" cy="330" rx="70" ry="52" transform="rotate(-18 140 330)"/>
    <ellipse cx="364" cy="282" rx="70" ry="52" transform="rotate(-18 364 282)"/>
  </g>

  <!-- Note. -->
  <g fill="url(#s2-chrome)">
    <path d="M160 104 416 56v66L160 170Z"/>
    <rect x="160" y="104" width="32" height="200"/>
    <rect x="384" y="56" width="32" height="200"/>
    <ellipse cx="128" cy="318" rx="70" ry="52" transform="rotate(-18 128 318)"/>
    <ellipse cx="352" cy="270" rx="70" ry="52" transform="rotate(-18 352 270)"/>
  </g>
  <g fill="none" stroke="#2f3d4e" stroke-opacity=".6" stroke-width="5">
    <path d="M160 104 416 56v66L160 170Z"/>
    <ellipse cx="128" cy="318" rx="70" ry="52" transform="rotate(-18 128 318)"/>
    <ellipse cx="352" cy="270" rx="70" ry="52" transform="rotate(-18 352 270)"/>
  </g>
  <!-- Speculars. -->
  <g fill="#fff" opacity=".75">
    <rect x="166" y="120" width="10" height="170" rx="5"/>
    <rect x="390" y="72" width="10" height="170" rx="5"/>
    <ellipse cx="106" cy="300" rx="26" ry="13" transform="rotate(-18 106 300)"/>
    <ellipse cx="330" cy="252" rx="26" ry="13" transform="rotate(-18 330 252)"/>
  </g>

  <path d="M440 128 451 160 483 171 451 182 440 214 429 182 397 171 429 160Z" fill="#fff" opacity=".9"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".08"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#s2-gloss)"/>
  <rect width="512" height="512" fill="url(#s2-vig)"/>
</svg>
