<!--
  Songs concept 3 - "Lyric screen".
  The pair to tuner-5: same navy body, same raised bezel and sunken glass, showing chords over
  lyrics. Picking 3 + tuner-5 gives two icons that are obviously one suite.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="s3-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="s3-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="s3-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="s3-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#s3-body)"/>

  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#s3-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>

  <!-- Three chord-over-lyric rows. -->
  <g fill="#ffe000">
    <rect x="120" y="132" width="52" height="26" rx="6"/>
    <rect x="196" y="132" width="38" height="26" rx="6"/>
    <rect x="258" y="132" width="60" height="26" rx="6"/>
  </g>
  <rect x="120" y="172" width="264" height="22" rx="8" fill="#22ff44"/>

  <g fill="#ffe000">
    <rect x="120" y="232" width="40" height="26" rx="6"/>
    <rect x="184" y="232" width="58" height="26" rx="6"/>
  </g>
  <rect x="120" y="272" width="216" height="22" rx="8" fill="#22ff44"/>

  <g fill="#ffe000">
    <rect x="120" y="332" width="58" height="26" rx="6"/>
    <rect x="202" y="332" width="40" height="26" rx="6"/>
    <rect x="266" y="332" width="50" height="26" rx="6"/>
  </g>
  <rect x="120" y="372" width="240" height="22" rx="8" fill="#22ff44"/>

  <!-- Glass sheen across the screen. -->
  <path d="M88 120a32 32 0 0 1 32-32h264a32 32 0 0 1 32 32v56c-90 44-238 44-328 0Z" fill="#fff" opacity=".12"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#s3-gloss)"/>
  <rect width="512" height="512" fill="url(#s3-vig)"/>
</svg>
