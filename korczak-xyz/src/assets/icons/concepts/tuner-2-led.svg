<!--
  Tuner concept 2 - "LED arc".
  Black glass body, an arc of tuning LEDs with the centre three lit green, and a big stencil A
  glowing underneath. The lit-green state is the one worth putting on a home screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="t2-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46586f"/>
      <stop offset=".5" stop-color="#141c28"/>
      <stop offset=".52" stop-color="#0a0f16"/>
      <stop offset="1" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="t2-a" x1="0" y1="200" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7ffd0"/>
      <stop offset=".45" stop-color="#4cf24c"/>
      <stop offset="1" stop-color="#0f9a25"/>
    </linearGradient>
    <linearGradient id="t2-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="t2-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#t2-body)"/>

  <!-- LED arc: dark ones off, the middle three lit. -->
  <g>
    <circle cx="66" cy="191" r="23" fill="#3a1010"/>
    <circle cx="126" cy="163" r="23" fill="#3a2410"/>
    <circle cx="386" cy="163" r="23" fill="#3a2410"/>
    <circle cx="446" cy="191" r="23" fill="#3a1010"/>
    <g fill="#25ff54">
      <circle cx="190" cy="146" r="34" opacity=".18"/>
      <circle cx="256" cy="140" r="38" opacity=".22"/>
      <circle cx="322" cy="146" r="34" opacity=".18"/>
    </g>
    <circle cx="190" cy="146" r="23" fill="#2bd94a"/>
    <circle cx="256" cy="140" r="26" fill="#48ff5e"/>
    <circle cx="322" cy="146" r="23" fill="#2bd94a"/>
    <g fill="#ffffff" opacity=".65">
      <circle cx="184" cy="139" r="7"/>
      <circle cx="249" cy="132" r="8"/>
      <circle cx="316" cy="139" r="7"/>
    </g>
  </g>

  <!-- Stencil A, the note being held. -->
  <circle cx="256" cy="310" r="150" fill="#25ff54" opacity=".1"/>
  <path d="M256 196 372 412 306 412 290 330 222 330 206 412 140 412Z" fill="url(#t2-a)"/>
  <path d="M256 196 372 412 306 412 290 330 222 330 206 412 140 412Z" fill="none" stroke="#0a5c18" stroke-width="6" stroke-linejoin="round"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".05"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#t2-gloss)"/>
  <rect width="512" height="512" fill="url(#t2-vig)"/>
</svg>
