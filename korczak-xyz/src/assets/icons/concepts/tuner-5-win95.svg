<!--
  Tuner concept 5 - "Win95 reborn".
  The current icon's parts - navy field, raised gray bezel, sunken black face, green ticks,
  yellow needle - redrawn full bleed and convex, so it keeps the site's identity but fills the
  rounded mask instead of sitting square inside it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="t5-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="t5-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="t5-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="t5-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#t5-body)"/>

  <!-- Raised bezel. -->
  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#t5-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <!-- Sunken face. -->
  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <!-- Dial. -->
  <g stroke="#22ff44" stroke-linecap="round">
    <g stroke-width="13">
      <line x1="126" y1="283" x2="106" y2="266"/>
      <line x1="386" y1="283" x2="406" y2="266"/>
      <line x1="184" y1="238" x2="173" y2="214"/>
      <line x1="328" y1="238" x2="339" y2="214"/>
    </g>
    <line x1="256" y1="222" x2="256" y2="196" stroke-width="22"/>
  </g>
  <polygon points="256,202 268,392 244,392" fill="#ffe000"/>
  <polygon points="256,202 261,392 253,392" fill="#fffbb0" opacity=".75"/>
  <circle cx="256" cy="392" r="28" fill="#d4d4d4"/>
  <circle cx="256" cy="392" r="28" fill="none" stroke="#000" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#t5-gloss)"/>
  <rect width="512" height="512" fill="url(#t5-vig)"/>
</svg>
