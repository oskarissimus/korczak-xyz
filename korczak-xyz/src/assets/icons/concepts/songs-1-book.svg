<!--
  Songs concept 1 - "Open songbook".
  Violet gloss body, an open book with a ribbon, and the thing the site actually renders: yellow
  chords sitting above green lyric lines.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="s1-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c79bff"/>
      <stop offset=".5" stop-color="#6c2fd6"/>
      <stop offset=".52" stop-color="#5a1fbd"/>
      <stop offset="1" stop-color="#2a0a63"/>
    </linearGradient>
    <linearGradient id="s1-page" x1="0" y1="140" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8dbe8"/>
    </linearGradient>
    <linearGradient id="s1-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="s1-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#s1-body)"/>
  <ellipse cx="256" cy="404" rx="196" ry="34" fill="#1c0448" opacity=".4"/>

  <!-- Covers under the pages. -->
  <path d="M256 186c-46-30-128-40-198-22v210c70-18 152-8 198 22Z" fill="#1f0a52"/>
  <path d="M256 186c46-30 128-40 198-22v210c-70-18-152-8-198 22Z" fill="#1f0a52"/>

  <!-- Pages. -->
  <path d="M256 172c-46-30-124-38-192-20v198c68-18 146-10 192 20Z" fill="url(#s1-page)"/>
  <path d="M256 172c46-30 124-38 192-20v198c-68-18-146-10-192 20Z" fill="url(#s1-page)"/>

  <!-- Chords over lyrics, left page then right. -->
  <g fill="#f2b800">
    <rect x="92" y="196" width="46" height="20" rx="6"/>
    <rect x="156" y="192" width="34" height="20" rx="6"/>
    <rect x="208" y="192" width="24" height="20" rx="6"/>
    <rect x="288" y="192" width="40" height="20" rx="6"/>
    <rect x="346" y="192" width="28" height="20" rx="6"/>
    <rect x="392" y="196" width="34" height="20" rx="6"/>
  </g>
  <g fill="#17a72c">
    <rect x="92" y="226" width="140" height="16" rx="6"/>
    <rect x="288" y="226" width="138" height="16" rx="6"/>
  </g>
  <g fill="#f2b800">
    <rect x="92" y="264" width="34" height="20" rx="6"/>
    <rect x="146" y="262" width="44" height="20" rx="6"/>
    <rect x="288" y="262" width="26" height="20" rx="6"/>
    <rect x="332" y="262" width="42" height="20" rx="6"/>
  </g>
  <g fill="#17a72c">
    <rect x="92" y="294" width="118" height="16" rx="6"/>
    <rect x="288" y="294" width="126" height="16" rx="6"/>
  </g>

  <!-- Spine and ribbon. -->
  <path d="M256 172v240c-8-6-16-11-26-15V162c10 3 19 6 26 10Z" fill="#0f0330" opacity=".55"/>
  <path d="M256 172v240c8-6 16-11 26-15V162c-10 3-19 6-26 10Z" fill="#0f0330" opacity=".35"/>
  <path d="M264 176h34v152l-17-20-17 20Z" fill="#e0203c"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#s1-gloss)"/>
  <rect width="512" height="512" fill="url(#s1-vig)"/>
</svg>
