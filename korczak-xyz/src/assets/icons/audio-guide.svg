<!--
  Home screen icon for the audio guide - "a pin that talks".

  Same navy body, raised bezel and sunken glass as the others; only the face differs, because they
  sit side by side on one home screen. A yellow map pin with green sound arcs coming off it: the
  pin alone is every map app there is, and the arcs are the whole of what this one does.
  Keep this comment short: libvips wants <svg> inside the first 1024 bytes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ag-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="ag-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="ag-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="ag-vig" cx=".5" cy=".45" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ag-body)"/>

  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#ag-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>

  <!--
    The pin, with a dropped copy behind it for the same lift the M has on the Metro Watch icon.
    Its hole is left black rather than filled: at 40px a yellow ring around a dark centre is the
    one part of a map pin that still reads.
  -->
  <g transform="translate(4 4)" opacity=".45">
    <path d="M198 132a76 76 0 0 0-76 76c0 56 76 148 76 148s76-92 76-148a76 76 0 0 0-76-76Z" fill="#000"/>
  </g>
  <path d="M198 132a76 76 0 0 0-76 76c0 56 76 148 76 148s76-92 76-148a76 76 0 0 0-76-76Z" fill="#ffe000"/>
  <circle cx="198" cy="208" r="30" fill="#040404"/>

  <!--
    Two arcs, in the site's green, springing from the pin's head. Two rather than three: a third
    would run into the bezel at 40px and read as a smudge.
  -->
  <g fill="none" stroke="#3cff6e" stroke-width="22" stroke-linecap="round">
    <path d="M259 145a95 95 0 0 1 0 126"/>
    <path d="M294 118a130 130 0 0 1 0 180" opacity=".75"/>
  </g>

  <!-- Glass sheen across the screen. -->
  <path d="M88 120a32 32 0 0 1 32-32h264a32 32 0 0 1 32 32v56c-90 44-238 44-328 0Z" fill="#fff" opacity=".12"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#ag-gloss)"/>
  <rect width="512" height="512" fill="url(#ag-vig)"/>
</svg>
