<!--
  Home screen icon for the Shopping List web app - "Trolley on glass".

  Source art for scripts/generate-icons.mjs. Same body, bezel and sunken glass as the other five -
  the suite reads as one - with the face showing a green trolley carrying a yellow tick: the basket
  says shopping and the tick says list, which is the pair no other icon here uses. Full bleed on the
  same terms as the others, including the note there about keeping this comment short.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="s1-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="s1-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="s1-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="s1-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#s1-body)"/>

  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#s1-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>

  <!--
    The handle and the wheels are strokes and the basket is a fill, which is what keeps this
    readable at 40px: a trolley drawn entirely in outline turns into four grey hairlines two rows
    down a home screen, where one solid mass still reads as a basket.
  -->
  <g stroke="#22ff44" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="18">
    <path d="M124 156h38l26 66"/>
    <path d="M212 316h132"/>
  </g>

  <path d="M180 214h218l-38 106H214Z" fill="#22ff44"/>

  <!--
    The tick rides in the basket, and it is drawn twice: the face colour first and wider, then the
    yellow inside it. Yellow directly on this green is two bright things fighting at 40px, where the
    dark keyline separates them into a mark on a shape. The wider stroke spills past the rim into
    the screen, which is the same black and therefore invisible.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M224 252l34 36 76-76" stroke="#040404" stroke-width="34"/>
    <path d="M224 252l34 36 76-76" stroke="#ffe000" stroke-width="16"/>
  </g>

  <circle cx="226" cy="358" r="20" fill="#22ff44"/>
  <circle cx="336" cy="358" r="20" fill="#22ff44"/>

  <!-- Glass sheen across the screen. -->
  <path d="M88 120a32 32 0 0 1 32-32h264a32 32 0 0 1 32 32v56c-90 44-238 44-328 0Z" fill="#fff" opacity=".12"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#s1-gloss)"/>
  <rect width="512" height="512" fill="url(#s1-vig)"/>
</svg>
