<!--
  Home screen icon for the annoying passenger simulator - "speech bubble on glass".

  Same body, bezel and sunken glass as the others; only the face differs, because they sit side
  by side on one home screen. A yellow speech bubble over a green road running to a vanishing
  point: the road says what it is looking at, the bubble says it will not shut up about it.
  Keep this comment short: libvips wants <svg> inside the first 1024 bytes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bk-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="bk-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="bk-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="bk-vig" cx=".5" cy=".45" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
    <clipPath id="bk-screen">
      <rect x="88" y="88" width="328" height="328" rx="32"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bk-body)"/>

  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#bk-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>

  <!--
    The road, clipped to the glass. Two verges and three dashes running to a vanishing point high
    on the screen - at 40px that is the smallest mark that still reads as "a road ahead" rather
    than as a triangle.
  -->
  <g clip-path="url(#bk-screen)">
    <path d="M232 168 280 168 392 416 120 416Z" fill="#0a3a12"/>
    <g fill="#2ee84a">
      <path d="M236 168 244 168 214 416 186 416Z"/>
      <path d="M268 168 276 168 326 416 298 416Z"/>
    </g>
    <g fill="#ffe000">
      <rect x="252" y="188" width="8" height="26" rx="3"/>
      <rect x="250" y="248" width="12" height="34" rx="4"/>
      <rect x="247" y="322" width="18" height="46" rx="6"/>
    </g>
  </g>

  <!-- The bubble, with the same dropped copy behind it the other faces use for lift. -->
  <g>
    <g transform="translate(5 5)" opacity=".45">
      <path d="M140 132h232a26 26 0 0 1 26 26v104a26 26 0 0 1-26 26H236l-58 46 10-46h-48a26 26 0 0 1-26-26V158a26 26 0 0 1 26-26Z" fill="#000"/>
    </g>
    <path d="M140 132h232a26 26 0 0 1 26 26v104a26 26 0 0 1-26 26H236l-58 46 10-46h-48a26 26 0 0 1-26-26V158a26 26 0 0 1 26-26Z" fill="#ffe000"/>
    <!-- Three lines of nothing in particular: the bubble is always full and never says anything. -->
    <g fill="#1220b4">
      <rect x="172" y="166" width="168" height="20" rx="8"/>
      <rect x="172" y="200" width="140" height="20" rx="8"/>
      <rect x="172" y="234" width="104" height="20" rx="8"/>
    </g>
  </g>

  <!-- Glass sheen across the screen. -->
  <path d="M88 120a32 32 0 0 1 32-32h264a32 32 0 0 1 32 32v56c-90 44-238 44-328 0Z" fill="#fff" opacity=".12"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#bk-gloss)"/>
  <rect width="512" height="512" fill="url(#bk-vig)"/>
</svg>
