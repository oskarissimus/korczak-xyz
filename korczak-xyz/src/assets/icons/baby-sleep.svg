<!--
  Home screen icon for the Baby Sleep Log web app - "Night on glass".

  Source art for scripts/generate-icons.mjs. Same body, bezel and sunken glass as tuner.svg and
  songs.svg - the suite reads as one - with the face showing a yellow crescent and green Zs, the
  two marks that say "sleep" at 40px without a word on them. Full bleed on the same terms as the
  others, including the note there about keeping this comment short.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="b1-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="b1-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="b1-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="b1-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#b1-body)"/>

  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#b1-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>

  <!--
    The crescent is a disc with a second disc punched out of it in the face colour rather than a
    single arc path: the bite then stays exactly circular at every raster size, and the face here
    is a flat fill with nothing behind it to show through.
  -->
  <circle cx="204" cy="244" r="84" fill="#ffe000"/>
  <circle cx="196" cy="236" r="34" fill="#fffbb0" opacity=".55"/>
  <circle cx="246" cy="210" r="76" fill="#040404"/>

  <!-- Zs, rising. -->
  <g stroke="#22ff44" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M289 320h78l-78 76h78" stroke-width="17"/>
    <path d="M311 232h54l-54 54h54" stroke-width="13"/>
    <path d="M328 166h36l-36 38h36" stroke-width="10"/>
  </g>

  <!-- Glass sheen across the screen. -->
  <path d="M88 120a32 32 0 0 1 32-32h264a32 32 0 0 1 32 32v56c-90 44-238 44-328 0Z" fill="#fff" opacity=".12"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#b1-gloss)"/>
  <rect width="512" height="512" fill="url(#b1-vig)"/>
</svg>
