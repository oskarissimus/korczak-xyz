<!--
  Home screen icon for the Guitar Flashcards web app - "Cards on glass".

  Source art for scripts/generate-icons.mjs. Same body, bezel and sunken glass as the rest of the
  suite. The face is a stack of cards: the front one a fragment of neck with a green note lit, the
  one behind it yellow, which is the songbook's chord colour and the only thing at 40px that says
  the deck holds chords too. Full bleed, same terms as the others - keep this comment short.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="k1-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="k1-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="k1-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="k1-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#k1-body)"/>

  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#k1-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>

  <!--
    The back card, yellow: the chord deck. Only its edge shows, which is all a 40px read has room
    for and enough to say the stack is not one kind of card.
  -->
  <g transform="rotate(-9 256 268)">
    <rect x="150" y="132" width="212" height="264" rx="16" fill="#000" opacity=".45"/>
    <rect x="146" y="128" width="212" height="264" rx="16" fill="#d8c832"/>
  </g>

  <!-- The middle card, green: the neck deck behind the one being read. -->
  <g transform="rotate(-4 256 268)">
    <rect x="158" y="140" width="212" height="264" rx="16" fill="#000" opacity=".4"/>
    <rect x="154" y="136" width="212" height="264" rx="16" fill="#2f9c46"/>
  </g>

  <!-- The front card: a fragment of neck with one note lit, drawn the way the app draws it. -->
  <rect x="164" y="148" width="212" height="264" rx="16" fill="#000" opacity=".4"/>
  <rect x="160" y="144" width="212" height="264" rx="16" fill="#e8e8e0"/>

  <!--
    Two frets and four strings, not the app's grid: at 40px a finer one stops being a neck and
    becomes texture, and the fret count is not the question the icon is asking.
  -->
  <g stroke="#9a9a90" stroke-width="9">
    <line x1="252" y1="182" x2="252" y2="374"/>
    <line x1="330" y1="182" x2="330" y2="374"/>
  </g>
  <!-- The nut. An open string is not stopped anywhere, so it is a bar and not a fret. -->
  <rect x="182" y="176" width="16" height="204" rx="4" fill="#4a4a44"/>
  <g stroke="#6c6c64" stroke-width="7" stroke-linecap="round">
    <line x1="198" y1="196" x2="352" y2="196"/>
    <line x1="198" y1="256" x2="352" y2="256"/>
    <line x1="198" y1="316" x2="352" y2="316"/>
    <line x1="198" y1="376" x2="352" y2="376"/>
  </g>

  <circle cx="291" cy="256" r="36" fill="#000"/>
  <circle cx="291" cy="256" r="33" fill="#22ff44"/>
  <circle cx="281" cy="245" r="11" fill="#b6ffc4" opacity=".8"/>

  <!-- Glass sheen across the screen. -->
  <path d="M88 120a32 32 0 0 1 32-32h264a32 32 0 0 1 32 32v56c-90 44-238 44-328 0Z" fill="#fff" opacity=".12"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#k1-gloss)"/>
  <rect width="512" height="512" fill="url(#k1-vig)"/>
</svg>
