<!--
  Home screen icon for the Metro Watch app - "M on glass".

  Same body, bezel and sunken glass as the other five; only the face differs, because they sit
  side by side. An M drawn as a stroked path rather than as text - librsvg would need a font on the
  build machine - over two bars in the lines' own colours, which are the same two the cards use.
  Keep this comment short: libvips wants <svg> inside the first 1024 bytes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="t1-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="t1-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="t1-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="t1-vig" cx=".5" cy=".45" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#t1-body)"/>

  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#t1-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>

  <!--
    The M, stroked rather than set in type. Round joins so the chevron does not spike at the apex,
    and a dropped copy behind it for the same lift the ticket has on the events icon.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="34">
    <path d="M156 320V180l100 86 100-86v140" stroke="#000" opacity=".45" transform="translate(4 4)"/>
    <path d="M156 320V180l100 86 100-86v140" stroke="#ffe000"/>
  </g>

  <!--
    The two lines, in the colours the cards use. They are here because the app watches exactly two
    of them, and because an M alone is every metro in Europe.
  -->
  <g stroke-linecap="round" stroke-width="20">
    <path d="M150 368h212" stroke="#2a6bff"/>
    <path d="M150 404h212" stroke="#ff3b3b"/>
  </g>

  <!-- Glass sheen across the screen. -->
  <path d="M88 120a32 32 0 0 1 32-32h264a32 32 0 0 1 32 32v56c-90 44-238 44-328 0Z" fill="#fff" opacity=".12"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#t1-gloss)"/>
  <rect width="512" height="512" fill="url(#t1-vig)"/>
</svg>
