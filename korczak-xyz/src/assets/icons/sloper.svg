<!--
  Home screen icon for the video generation wizard - "film frame on glass".

  Same body, bezel and sunken glass as the others; only the face differs, because they sit side
  by side on one home screen. A green play triangle between two yellow-perforated sprocket rails,
  with a spark off its tip - the rails say video, the spark says the video is made rather than
  played. Keep this comment short: libvips wants <svg> inside the first 1024 bytes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sl-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="sl-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="sl-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="sl-vig" cx=".5" cy=".45" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sl-body)"/>

  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#sl-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>

  <!--
    The two sprocket rails. Four perforations each, not the eight a real strip would have: at the
    40px this is read at, a finer pitch stops being a film strip and becomes a dotted line.
  -->
  <g fill="#1c1c1c">
    <rect x="104" y="112" width="44" height="280" rx="10"/>
    <rect x="364" y="112" width="44" height="280" rx="10"/>
  </g>
  <g fill="#ffe000">
    <rect x="114" y="132" width="24" height="26" rx="7"/>
    <rect x="114" y="196" width="24" height="26" rx="7"/>
    <rect x="114" y="260" width="24" height="26" rx="7"/>
    <rect x="114" y="324" width="24" height="26" rx="7"/>
    <rect x="374" y="132" width="24" height="26" rx="7"/>
    <rect x="374" y="196" width="24" height="26" rx="7"/>
    <rect x="374" y="260" width="24" height="26" rx="7"/>
    <rect x="374" y="324" width="24" height="26" rx="7"/>
  </g>

  <!-- The play triangle, with the same dropped copy behind it the other faces use for lift. -->
  <g stroke-linejoin="round" stroke-width="22">
    <path d="M196 190 314 256 196 322Z" fill="#000" stroke="#000" opacity=".45" transform="translate(4 4)"/>
    <path d="M196 190 314 256 196 322Z" fill="#2ee84a" stroke="#2ee84a"/>
  </g>

  <!-- The spark: this app makes the video, it does not play one back. -->
  <g>
    <path d="M334 140q5 26 26 31-21 5-26 31-5-26-26-31 21-5 26-31Z" fill="#000" opacity=".45" transform="translate(4 4)"/>
    <path d="M334 140q5 26 26 31-21 5-26 31-5-26-26-31 21-5 26-31Z" fill="#ffe000"/>
  </g>

  <!-- Glass sheen across the screen. -->
  <path d="M88 120a32 32 0 0 1 32-32h264a32 32 0 0 1 32 32v56c-90 44-238 44-328 0Z" fill="#fff" opacity=".12"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#sl-gloss)"/>
  <rect width="512" height="512" fill="url(#sl-vig)"/>
</svg>
