<!--
  Home screen icon for the Event Watch app - "Ticket on glass".

  Same body, bezel and sunken glass as the other four; only what is on the face differs, because
  they sit side by side. A yellow torn ticket over a green calendar grid: the stub says "there is
  something to buy", which is the whole point of the app, and reads at 40px where dates would not.
  Full bleed, and keep this comment short - libvips wants <svg> inside the first 1024 bytes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="e1-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="e1-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="e1-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="e1-vig" cx=".5" cy=".45" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#e1-body)"/>

  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#e1-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>

  <!--
    The calendar behind the ticket: a hanger bar and four marks, not a real grid. Seven columns
    would be texture at 40px rather than a calendar, the same reason the flashcards icon draws two
    frets where the app draws five.
  -->
  <g stroke="#22ff44" fill="none" stroke-linecap="round">
    <path d="M150 168h212" stroke-width="14"/>
    <path d="M186 140v34M326 140v34" stroke-width="14"/>
  </g>
  <g fill="#22ff44" opacity=".55">
    <rect x="150" y="204" width="46" height="34" rx="6"/>
    <rect x="316" y="204" width="46" height="34" rx="6"/>
  </g>

  <!--
    The ticket. The notch is punched with two discs in the face colour rather than cut into the
    path, so the bite stays exactly circular at every raster size - the crescent's trick on the
    sleep icon, for the same reason.
  -->
  <g transform="rotate(-8 256 306)">
    <rect x="132" y="248" width="248" height="118" rx="14" fill="#000" opacity=".45"/>
    <rect x="128" y="244" width="248" height="118" rx="14" fill="#ffe000"/>
    <rect x="136" y="252" width="120" height="46" rx="8" fill="#fffbb0" opacity=".5"/>
    <circle cx="292" cy="244" r="20" fill="#040404"/>
    <circle cx="292" cy="362" r="20" fill="#040404"/>
    <g stroke="#040404" stroke-width="9" stroke-linecap="round" opacity=".8">
      <path d="M320 276v54M340 276v54"/>
    </g>
  </g>

  <!-- Glass sheen across the screen. -->
  <path d="M88 120a32 32 0 0 1 32-32h264a32 32 0 0 1 32 32v56c-90 44-238 44-328 0Z" fill="#fff" opacity=".12"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#e1-gloss)"/>
  <rect width="512" height="512" fill="url(#e1-vig)"/>
</svg>
