<!--
  Home screen icon for the Fretboard Trainer web app - "Neck on glass".

  Source art for scripts/generate-icons.mjs. Same body, bezel and sunken glass as tuner.svg and
  songs.svg - the suite reads as one - with the face showing a neck seen the way the app draws
  it: nut on the left, strings across, one green note lit. Full bleed on the same terms as the
  others, including the note there about keeping this comment short.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="f1-body" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6bff"/>
      <stop offset=".5" stop-color="#1220b4"/>
      <stop offset=".52" stop-color="#000f8c"/>
      <stop offset="1" stop-color="#00003c"/>
    </linearGradient>
    <linearGradient id="f1-bezel" x1="0" y1="64" x2="0" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#dcdcdc"/>
      <stop offset=".75" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
    <linearGradient id="f1-gloss" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="f1-vig" cx="256" cy="256" r="330" gradientUnits="userSpaceOnUse">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#f1-body)"/>

  <rect x="56" y="56" width="400" height="400" rx="52" fill="#000" opacity=".35"/>
  <rect x="52" y="52" width="400" height="400" rx="52" fill="url(#f1-bezel)"/>
  <path d="M52 104a52 52 0 0 1 52-52h296a52 52 0 0 1 52 52 40 40 0 0 0-40-32H92a40 40 0 0 0-40 32Z" fill="#fff" opacity=".85"/>

  <rect x="88" y="88" width="328" height="328" rx="32" fill="#040404"/>
  <path d="M88 128a40 40 0 0 1 40-40h256a40 40 0 0 1 40 40 20 20 0 0 0-20-20H108a20 20 0 0 0-20 20Z" fill="#6a6a6a"/>

  <!--
    Four frets, not the app's five: at 60px - a home screen icon two rows down - a finer grid
    stops being a neck and becomes texture. The count is not the question the icon is asking.
    Wires first, strings over them, the way a neck is actually stacked.
  -->
  <g stroke="#7a7a7a" stroke-width="8">
    <line x1="186" y1="146" x2="186" y2="360"/>
    <line x1="254" y1="146" x2="254" y2="360"/>
    <line x1="322" y1="146" x2="322" y2="360"/>
    <line x1="390" y1="146" x2="390" y2="360"/>
  </g>

  <!-- The nut. An open string is not stopped anywhere, so it is a bar and not a fret. -->
  <rect x="124" y="134" width="15" height="238" rx="4" fill="#e0e0e0"/>

  <g stroke="#b8b8b8" stroke-width="6" stroke-linecap="round">
    <line x1="139" y1="148" x2="390" y2="148"/>
    <line x1="139" y1="190" x2="390" y2="190"/>
    <line x1="139" y1="232" x2="390" y2="232"/>
    <line x1="139" y1="274" x2="390" y2="274"/>
    <line x1="139" y1="316" x2="390" y2="316"/>
    <line x1="139" y1="358" x2="390" y2="358"/>
  </g>

  <!-- The card: one position, lit. -->
  <circle cx="288" cy="274" r="34" fill="#000"/>
  <circle cx="288" cy="274" r="32" fill="#22ff44"/>
  <circle cx="279" cy="264" r="11" fill="#b6ffc4" opacity=".8"/>

  <!-- Glass sheen across the screen. -->
  <path d="M88 120a32 32 0 0 1 32-32h264a32 32 0 0 1 32 32v56c-90 44-238 44-328 0Z" fill="#fff" opacity=".12"/>
  <rect x="88" y="88" width="328" height="328" rx="32" fill="none" stroke="#000" stroke-opacity=".8" stroke-width="6"/>

  <path d="M0 512h512v-72c-80-72-432-72-512 0Z" fill="#fff" opacity=".07"/>
  <path d="M0 0h512v206c-90 92-422 92-512 0Z" fill="url(#f1-gloss)"/>
  <rect width="512" height="512" fill="url(#f1-vig)"/>
</svg>
