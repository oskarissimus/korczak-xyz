name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires >=22.12.0, which korczak-xyz/package.json now states as `engines`.
          # This is the only place that floor is enforced: nothing checks `engines` on its own.
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: "korczak-xyz/package-lock.json"
      - name: Install dependencies
        run: npm ci
        working-directory: korczak-xyz
      - name: Test
        # The events app is the first thing here whose failure mode is "wakes you up at 7am", so
        # the pure decision layers — the matcher, the notice planner, the service worker bundle —
        # are worth a gate rather than a habit.
        run: npm test
        working-directory: korczak-xyz
      - name: Build
        run: npm run build
        working-directory: korczak-xyz

      # This job used to build the site and throw it away, while Netlify ran its own build and
      # deployed that one. Deploying the artifact we just tested closes that gap: a red test now
      # blocks the deploy, which it could not do when the two builds were separate.
      #
      # Every push to main deploys, including one that touches only CLAUDE.md. Netlify skipped
      # those (its base directory was korczak-xyz/, and its monorepo default skips a commit that
      # changed nothing under it), which meant the navbar could be showing an older hash than HEAD
      # and you had to know whether this commit was one of those. It always matches now.
      #
      # `git rev-parse --short HEAD` runs during the build, in Navbar.astro — actions/checkout
      # leaves a real .git, so the status bar keeps reporting the commit it was built from.
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: korczak-xyz

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: "functions/package-lock.json"
      - name: Install dependencies
        run: npm ci
        working-directory: functions
      # Typechecks the collector AND the site's src/utils/events, which tsconfig.json compiles in
      # from the sibling directory — so a change there that breaks the backend fails here rather
      # than at deploy.
      - name: Build
        run: npm run build
        working-directory: functions
      - name: Test
        # LIVE is unset, so the smoke test that hits teatrwielki.pl and python.org stays skipped.
        run: npm test
        working-directory: functions
