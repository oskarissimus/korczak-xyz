name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires >=22.12.0. Keep in sync with the NODE_VERSION pin
          # in korczak-xyz/netlify.toml so CI builds what Netlify deploys.
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: "korczak-xyz/package-lock.json"
      - name: Install dependencies
        run: npm ci
        working-directory: korczak-xyz
      - name: Build
        run: npm run build
        working-directory: korczak-xyz
