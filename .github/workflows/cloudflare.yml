# Applies terraform/cloudflare/ — the Cloudflare layer: the songbook's media bucket and its domain,
# and whatever of the zone moves out of the dashboard after it. See terraform/cloudflare/README.md.
#
# A workflow of its own rather than a job in firebase-deploy.yml or node.js.yml, because a failure
# here must block neither: a Cloudflare token short of a permission is no reason to hold back a
# Cloud Functions deploy or the site. The site never needs anything this applies in the same push —
# the videos fall back to YouTube until the bucket has them (korczak-xyz/src/components/Video.tsx).
#
# Two credentials: Workload Identity Federation for GCP, only because the state lives in the GCS
# bucket the project layer already uses; and CLOUDFLARE_API_TOKEN for everything it changes.
name: Cloudflare

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/cloudflare/**"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: terraform/cloudflare
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # Before any credential, so malformed HCL fails on its own rather than looking like an auth problem.
      - name: Validate
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Authenticate to Google Cloud (state only)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Init
        run: terraform init -input=false -reconfigure

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      # Same gate as the project layer's, for the same reason: this repo commits straight to main,
      # so nobody reads a plan before it applies, and nothing in here should ever delete. A deleted
      # bucket is every uploaded video gone.
      - name: Refuse a plan that destroys anything
        run: |
          terraform show -json tfplan > tfplan.json
          doomed=$(jq -r '[.resource_changes[]? | select(.change.actions[]? == "delete") | .address] | join(", ")' tfplan.json)
          if [ -n "$doomed" ]; then
            echo "::error title=Terraform wants to destroy::$doomed"
            exit 1
          fi

      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan
