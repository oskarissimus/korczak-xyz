# The RPG's production: rpg.korczak.xyz, deployed from GitHub releases.
#
# korczak.xyz follows main (node.js.yml deploys every push). rpg.korczak.xyz moves only when a
# release is published, so a half-finished game on main never reaches the people playing it, and
# the release page is the changelog and the list of points to go back to.
#
# Why a release and not a bare tag push: publishing a release creates its tag anyway, and on top
# of that carries the notes, can be drafted and published later, and can be marked pre-release
# (which this workflow ignores — a pre-release does not deploy). A tag pushed without a release
# deploys nothing; turn it into a release on GitHub to ship it.
#
# Rolling back is running this workflow by hand with an older tag (Actions -> RPG release -> Run
# workflow), which builds and deploys exactly that commit. It never touches korczak.xyz. Run by hand
# with a NEW tag, it makes that release from main and ships it (the `release` job).
#
# What is deployed is the whole site built in mode `rpg` (`.env.rpg`) to a second Worker
# (`env.rpg` in korczak-xyz/wrangler.jsonc), with the game as its front door
# (scripts/rpg-release.mjs). The backend is the game's own GCP project, korczak-rpg
# (terraform/rpg/): the `backend` job deploys the Firestore rules and indexes and the game's three
# functions (`rpgDemo`, `rpgApi`, `rpgJob`) there from the same tag, before the front goes out, so
# a release never serves a page that calls functions older than itself.
#
# The three GCP values are written below rather than kept as repository variables: none is a
# secret (Workload Identity needs no key), and terraform/rpg/outputs.tf is where they come from.
name: RPG release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.2.0). An existing release is redeployed (rollback, re-run); a new tag becomes a release of the branch this is run from"
        required: true

# One production deploy at a time, and never cancel one half-way: a cancelled `wrangler deploy`
# leaves whichever version last finished, which is fine, but two racing can leave an older release
# live after a newer one.
concurrency:
  group: rpg-release
  cancel-in-progress: false

env:
  REF: ${{ github.event_name == 'release' && github.event.release.tag_name || format('refs/tags/{0}', inputs.tag) }}
  GCP_PROJECT: korczak-rpg
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/921805700652/locations/global/workloadIdentityPools/github/providers/github
  GCP_SERVICE_ACCOUNT: github-deployer@korczak-rpg.iam.gserviceaccount.com

jobs:
  # A run by hand with a tag no release has yet makes that release first, from the commit the run
  # was started on (main, normally) — so shipping is one button, and a Claude session, which can
  # start a workflow but has no way to create a release, can ship too. Made with GITHUB_TOKEN, which
  # by GitHub's design starts no workflow, so this does not also fire the `release` trigger above
  # and deploy twice. An existing tag is left alone: that run is a rollback or a re-run.
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make the release if the tag has none
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: redeploying it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes
          fi

  backend:
    needs: release
    # `always()` because `release` is skipped on the release trigger, and a skipped need would
    # otherwise skip this too.
    if: >-
      always() && needs.release.result != 'failure' && needs.release.result != 'cancelled' &&
      (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    # The pool in korczak-rpg trusts tokens from this environment only, so this is the one job in
    # the repository that can act on the game's production.
    environment:
      name: rpg-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: "functions/package-lock.json"
      - name: Install dependencies
        run: npm ci
        working-directory: functions
      - name: Build and test the functions
        run: npm run build && npm test
        working-directory: functions
      - name: Authenticate to korczak-rpg
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      # Only the game's three functions: the rest of the codebase is the site's and has no business
      # in this project (and its secrets do not exist here). No storage rules either — the one
      # bucket here is written by these functions alone and read by download-token URL.
      - name: Deploy rules and the game's functions
        run: >-
          npx --yes firebase-tools@15 deploy
          --only firestore:rules,firestore:indexes,functions:rpgDemo,functions:rpgApi,functions:rpgJob
          --project "$GCP_PROJECT" --non-interactive --force

  deploy:
    needs: backend
    # Explicit for the same reason: a skipped `release` upstream would skip this by default.
    if: always() && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: rpg-production
      url: https://rpg.korczak.xyz/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: "korczak-xyz/package-lock.json"
      - name: Install dependencies
        run: npm ci
        working-directory: korczak-xyz
      - name: Test
        run: npm test
        working-directory: korczak-xyz
      - name: Build
        run: npm run build -- --mode rpg
        working-directory: korczak-xyz
        env:
          # Same as node.js.yml: without it the build still succeeds, minus readable stack traces.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Put the game at the front door
        run: node scripts/rpg-release.mjs dist
        working-directory: korczak-xyz
      - name: Deploy to rpg.korczak.xyz
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: korczak-xyz
          environment: rpg
