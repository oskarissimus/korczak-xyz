# Deploys the Firestore and Storage rules and the two collectors — Event Watch and the metro
# watcher — and, in a job of its own, the audio guide's Go function. The rules go out only after they have been run against the emulator (see "The rules
# contract" below), because since sign-up was opened up they are the only thing standing between a
# stranger with an account and everything in the database.
#
# Separate from node.js.yml because it is path-filtered: the site deploys on every push from that
# workflow, but redeploying Cloud Functions on a commit that only touched a song chart would take
# three minutes and change nothing. The paths below are exactly what can affect the backend —
# note that `korczak-xyz/src/utils/{events,transit}/**` and `utils/sloper/job.ts` are in the
# list, because functions/tsconfig.json compiles those into the deploy bundle rather than keeping
# a copy of any of them.
#
# Auth is Workload Identity Federation, so there is no long-lived service account key in GitHub.
# The security boundary is the provider's attribute-condition, which pins it to this repository —
# without that, any repo on GitHub could mint a token for the pool.
#
# The `terraform` job runs BEFORE `deploy`, and that ordering is a feature rather than tidiness: a
# commit that needs a new API and ships the code using it would otherwise fail on the deploy, which
# is exactly how GEMINI_API_KEY took a build down. See terraform/README.md for what Terraform owns
# and, more importantly, what it deliberately does not.
name: Deploy Firebase

on:
  push:
    branches: ["main"]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - "korczak-xyz/src/utils/events/**"
      - "korczak-xyz/src/utils/transit/**"
      # Two files rather than the directory, because only one file of `utils/sloper/` compiles into
      # the functions bundle: `job.ts`, the assembly job that the browser writes and the assembler
      # reads. The rest of that directory talks to the DOM and to providers and could not compile
      # there at all — see the note at the top of it.
      #
      # The tsconfig beside it is in the list for a reason that is easy to miss and cost a run:
      # it is what stops Vite's tsconfig walk reaching the site's `astro/tsconfigs/strict`, which
      # this runner has no node_modules for. A commit that only touches it is a commit that decides
      # whether these tests can run at all, so it has to be able to run them.
      - "korczak-xyz/src/utils/sloper/job.ts"
      - "korczak-xyz/src/utils/sloper/tsconfig.json"
      - "terraform/**"
      - "audio-guide-function/**"
      - ".github/workflows/firebase-deploy.yml"
  # So rules can be pushed out without waiting for a code change to ride along.
  workflow_dispatch:

# One deploy at a time. Two concurrent `firebase deploy --only functions` runs race to create the
# same source bucket and one of them loses with a 409 — which is exactly how the first manual
# deploy of these two functions failed.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  # The project layer: APIs, IAM, secret containers. Runs on every deploy, not only when
  # terraform/ changed — it is idempotent, costs a handful of API calls, and running it always is
  # what makes the ordering guarantee above hold.
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Until the one-time bootstrap in terraform/README.md has been run, the state bucket does not
      # exist and the deploy account does not hold the roles Terraform needs. That must not block
      # deploying the app: this job no-ops loudly instead, and the deploy carries on exactly as it
      # did before Terraform existed. Once bootstrapped, a real failure here DOES stop the deploy,
      # which is the point.
      - name: Has the bootstrap been run?
        id: bootstrap
        run: |
          if gcloud storage buckets describe "gs://${{ vars.FIREBASE_PROJECT_ID }}-tfstate" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Terraform not bootstrapped::No state bucket. See terraform/README.md. Skipping the project layer; the app still deploys."
          fi

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      # Unconditional, and before the bootstrap gate on purpose: `-backend=false` needs no bucket
      # and no credentials, so malformed HCL is caught on the very first push rather than lying in
      # wait until somebody runs the bootstrap weeks later. It is also the only check on this
      # directory that runs without any of the setup existing.
      - name: Validate
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform

      - name: Init
        if: steps.bootstrap.outputs.ready == 'true'
        run: terraform init -input=false -reconfigure
        working-directory: terraform

      - name: Plan
        if: steps.bootstrap.outputs.ready == 'true'
        run: terraform plan -input=false -out=tfplan
        working-directory: terraform

      # This repo commits straight to main, so there is no pull request at which a human reads the
      # plan before it applies. This is the gate instead, and it is a better one for the failure
      # that actually matters: nothing in this directory should ever destroy anything. Deleting a
      # secret container takes its versions with it, and VAPID_PUBLIC_KEY can never be reissued.
      #
      # `prevent_destroy` already guards the two resources that carry it; this catches the whole
      # directory, including a resource somebody adds later and forgets to guard.
      - name: Refuse a plan that destroys anything
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          terraform show -json tfplan > tfplan.json
          doomed=$(jq -r '[.resource_changes[]? | select(.change.actions[]? == "delete") | .address] | join(", ")' tfplan.json)
          if [ -n "$doomed" ]; then
            echo "::error title=Terraform wants to destroy::$doomed"
            echo "Nothing in terraform/ should ever delete. Read the plan before going further."
            exit 1
          fi
        working-directory: terraform

      - name: Apply
        if: steps.bootstrap.outputs.ready == 'true'
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: terraform

  deploy:
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      # Required for the OIDC token WIF exchanges. Without it the auth step fails with a
      # not-obviously-related "unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: "functions/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      # Deliberately before the deploy, not in a separate workflow: nothing should be able to
      # reach the collector that has not typechecked and passed its tests. The build also
      # typechecks the site's src/utils/{events,transit} and its sloper/job.ts, which this bundle
      # compiles in.
      - name: Build
        run: npm run build
        working-directory: functions

      - name: Test
        # LIVE is unset, so the smoke test that hits teatrwielki.pl and python.org stays skipped —
        # a deploy must not depend on somebody else's website being up.
        run: npm test
        working-directory: functions

      # The Firestore emulator is a jar, and firebase-tools 15 refuses to run it on anything below
      # JDK 21 — the runner image's default is 17, which fails the step below with a message about
      # Java rather than about rules. Temurin 21 is what a local run has; this is what makes CI the
      # same machine.
      - name: Java, for the emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The rules are the whole admissions policy now that anybody can sign up, and the way they
      # fail is silent: a ruleset that quietly grants everything looks, from every screen in the
      # app, exactly like one that works. So they are executed against the real rules engine before
      # they are allowed out — `emulators:exec` starts the Firestore emulator, points
      # FIRESTORE_EMULATOR_HOST at it, and that env var is what un-skips the test.
      #
      # It runs from the repository root because that is where firebase.json and firestore.rules
      # are; the vitest run itself is in `functions/`, which is the package holding the emulator's
      # one devDependency.
      - name: The rules contract
        run: |
          npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-rules \
            "npm test --prefix functions -- src/rules.test.ts"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy rules and functions
        # Rules and indexes first and in the same step, because the collector writes documents the
        # rules describe and the feed reads through the indexes: a function live against stale rules,
        # or a client querying without an index, is the window worth closing.
        #
        # The predeploy hook in firebase.json calls ./node_modules/.bin/tsc directly rather than
        # `npm run build` — the firebase CLI ships its own bundled node 20 / npm 8, and that npm
        # throws `Cannot read properties of undefined (reading 'stdin')` after the script has
        # already succeeded, failing a perfectly good deploy.
        #
        # `storage` rides with them, and its bucket is Terraform's (terraform/storage.tf) — so the
        # job ordering that already exists is what makes this work on a project where the bucket is
        # new: the apply registers it with Firebase, and only then does the CLI have somewhere to
        # put the rules.
        #
        # It is `storage` and NOT `storage:rules`, which is the trap: after a colon the CLI reads a
        # deploy TARGET name (the `.firebaserc` kind), not a sub-resource the way `firestore:rules`
        # does. There are no storage targets here, so `storage:rules` fails with "Could not find
        # rules for the following storage targets: rules". Bare `storage` deploys every entry in
        # firebase.json's `storage` array, which is the one bucket.
        run: npx --yes firebase-tools@15 deploy --only firestore:rules,firestore:indexes,storage,functions --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive --force

  # The audio guide's backend, in Go, so it is not something the Firebase CLI can deploy — the CLI
  # does Node and Python. It goes out with `gcloud functions deploy` instead, beside the Node
  # functions in the same project and region but not in their codebase: firebase-tools only ever
  # deletes functions carrying its own `deployment-tool` label, so `--force` above cannot remove
  # this one, and this job cannot touch those.
  #
  # After `terraform` because the function writes each guide's record into a bucket that job
  # creates and grants it (terraform/audio-guide.tf). No secrets either: the keys are the caller's and arrive with each request (see
  # audio-guide-function/function.go).
  audio-guide:
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: audio-guide-function
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: audio-guide-function/go.mod
          cache-dependency-path: audio-guide-function/go.sum

      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go vet ./...
          go test ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # `--max-instances` is a ceiling on what a stranger can use this for. The providers are paid
      # with the caller's keys, but the instance time is ours, and five at once is more than the
      # one page that calls this will ever ask for honestly.
      #
      # The two env vars are where each guide's record goes and which commit wrote it
      # (audio-guide-function/record.go). The bucket is terraform/audio-guide.tf's, created by the
      # job this one needs. `--set-env-vars` replaces the whole set, which is right: these are all
      # there are.
      - name: Deploy generate-audio
        run: |
          gcloud functions deploy generate-audio \
            --project="${{ vars.FIREBASE_PROJECT_ID }}" \
            --set-env-vars="GUIDE_RECORDS_BUCKET=${{ vars.FIREBASE_PROJECT_ID }}-audio-guide-records,GUIDE_RELEASE=$(git rev-parse --short HEAD)" \
            --gen2 \
            --runtime=go126 \
            --region=europe-central2 \
            --source=. \
            --entry-point=GenerateAudio \
            --trigger-http \
            --allow-unauthenticated \
            --memory=256Mi \
            --timeout=120s \
            --max-instances=5 \
            --quiet
